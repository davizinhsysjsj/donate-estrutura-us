<!DOCTYPE html>
<html lang="nl" class="bg-black-deep">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Help vanavond Belgische opvangdieren te voeden — PawsCo Opvang." />
    <!-- Preload hero LCP image — carrega antes de tudo -->
    <link rel="preload" as="image" href="%sveltekit.assets%/hero-rescue.webp" type="image/webp" />

    <!-- Sem Google Fonts: system font stack nativo (Inter ja vem no iOS/macOS/Windows 11) -->

    <!-- Meta Pixel — inicializa stub imediatamente (nao bloqueia), carrega fbevents.js apos idle -->
    <script>
      // Stub do fbq: captura chamadas antes do SDK carregar
      window.fbq=function(){(window.fbq.queue=window.fbq.queue||[]).push(arguments)};
      window.fbq.loaded=true;window.fbq.version='2.0';window.fbq.queue=[];window._fbq=window.fbq;
      fbq('init','2237078953695974');
      fbq('track','PageView');
      // Carrega o SDK real apos o browser ficar idle (nao bloqueia LCP nem TBT)
      (window.requestIdleCallback||function(c){setTimeout(c,200)})(function(){
        var s=document.createElement('script');s.async=true;
        s.src='https://connect.facebook.net/en_US/fbevents.js';
        document.head.appendChild(s);
      });
    </script>
    <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=2237078953695974&ev=PageView&noscript=1"/></noscript>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QFFW57YSB7"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-QFFW57YSB7');
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-black-deep text-snow antialiased">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>

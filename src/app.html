<!DOCTYPE html>
<html lang="nl" class="bg-black-deep">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/dashboard/vitrack-favicon.png?v=3" type="image/png" />
    <!-- Apple touch icon (iPhone/iPad: tela inicial + favicon Safari) -->
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/dashboard/vitrack-apple-icon.png?v=3" />
    <link rel="apple-touch-icon-precomposed" href="%sveltekit.assets%/dashboard/vitrack-apple-icon.png?v=3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vitrack" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Help vanavond Belgische opvangdieren te voeden — PawsCo Opvang." />
    <!-- Preload hero LCP image — carrega antes de tudo -->
    <link rel="preload" as="image" href="%sveltekit.assets%/hero-rescue.webp" type="image/webp" />

    <!-- Sem Google Fonts: system font stack nativo (Inter ja vem no iOS/macOS/Windows 11) -->

    <!-- White page bypass: rotas white-only nao carregam nenhum pixel -->
    <script>
      window.__IS_WHITE__ = /^\/white(\/|$)/.test(window.location.pathname);
    </script>

    <!-- Meta Pixel — snippet oficial (async, nao bloqueia, compativel com Pixel Helper) -->
    <script>
      if (!window.__IS_WHITE__) {
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window,document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init','1602024645266669');
      fbq('track','PageView');
      }
    </script>
    <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1602024645266669&ev=PageView&noscript=1"/></noscript>

    <!-- UTMify Pixel -->
    <script>
      if (!window.__IS_WHITE__) {
      window.pixelId = "6a188219321712a4cef7bb67";
      var a = document.createElement("script");
      a.setAttribute("async", "");
      a.setAttribute("defer", "");
      a.setAttribute("src", "https://cdn.utmify.com.br/scripts/pixel/pixel.js");
      document.head.appendChild(a);
      }
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-black-deep text-snow antialiased">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
